<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Petal 1: Magenta to Purple -->
    <linearGradient id="petal-grad-1" x1="20%" y1="10%" x2="60%" y2="50%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Petal 2: Cyan to Deep Blue -->
    <linearGradient id="petal-grad-2" x1="90%" y1="15%" x2="45%" y2="55%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Petal 3: Red to Orange to Yellow -->
    <linearGradient id="petal-grad-3" x1="50%" y1="50%" x2="95%" y2="80%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Petal 4: Green to Lime -->
    <linearGradient id="petal-grad-4" x1="50%" y1="55%" x2="35%" y2="95%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="60%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>

    <!-- Petal 5: Emerald to Teal / Aqua -->
    <linearGradient id="petal-grad-5" x1="45%" y1="50%" x2="10%" y2="55%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Master Leaf definition with outer contour and inner vein -->
    <g id="master-leaf">
      <!-- Outer leaf contour -->
      <path 
        d="M 41 44 C 33.5 38.5, 27 28.5, 30.8 12.8 C 34.5 15.5, 43.5 25, 48.2 39.5" 
        stroke-width="2.4" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
      />
      <!-- Inner vein spine -->
      <path 
        d="M 47 41 C 45.8 33.5, 42.2 27.2, 36.8 23" 
        stroke-width="2.2" 
        stroke-linecap="round" 
      />
    </g>
  </defs>

  <!-- 5 Rotated Petals around center (50, 50) -->
  <!-- Petal 1: Top-Left (Magenta/Purple) -->
  <use href="#master-leaf" stroke="url(#petal-grad-1)" />

  <!-- Petal 2: Top-Right (Cyan/Blue) rotated 72 deg -->
  <use href="#master-leaf" transform="rotate(72 50 50)" stroke="url(#petal-grad-2)" />

  <!-- Petal 3: Bottom-Right (Red/Orange/Yellow) rotated 144 deg -->
  <use href="#master-leaf" transform="rotate(144 50 50)" stroke="url(#petal-grad-3)" />

  <!-- Petal 4: Bottom (Green/Lime) rotated 216 deg -->
  <use href="#master-leaf" transform="rotate(216 50 50)" stroke="url(#petal-grad-4)" />

  <!-- Petal 5: Left (Teal/Aqua) rotated 288 deg -->
  <use href="#master-leaf" transform="rotate(288 50 50)" stroke="url(#petal-grad-5)" />
</svg>